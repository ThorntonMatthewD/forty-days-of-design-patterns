inputSet:
  name: PR Trigger
  identifier: PR_Trigger
  orgIdentifier: default
  projectIdentifier: default_project
  pipeline:
    identifier: preparation_pipeline
    properties:
      ci:
        codebase:
          repoName: <+input>
          build:
            type: PR
            spec:
              number: <+trigger.prNumber>
    stages:
      - stage:
          identifier: Execute_Tests
          type: Pipeline
          spec:
            inputs:
              identifier: Execute_Tests
              properties:
                ci:
                  codebase:
                    build:
                      type: branch
                      spec:
                        branch: <+trigger.branch>
